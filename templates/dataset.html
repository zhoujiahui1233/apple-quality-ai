{% extends "base.html" %}
{% block title %}数据集管理{% endblock %}
{% block content %}
<style>
.cat-card { padding: 16px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 16px; }
.cat-title { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 10px; }
.cat-title span { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 8px; }
.label-group { margin-bottom: 12px; }
.label-title { font-size: 13px; color: var(--accent); margin: 8px 0 6px; font-weight: 600; }
.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
.img-item { position: relative; }
.img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
.img-grid img:hover { border-color: var(--danger); transform: scale(1.05); }
.img-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(255,71,87,0.8); color: #fff; font-size: 10px; cursor: pointer; opacity: 0; transition: 0.3s; }
.img-move { position:absolute; bottom:4px; right:4px; font-size:10px; padding:2px 4px; border-radius:4px; border:1px solid var(--border); background:rgba(0,0,0,0.75); color:var(--text); cursor:pointer; max-width:64px; }
.img-item:hover .img-del { opacity: 1; }
.stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-box { flex: 1; min-width: 100px; padding: 14px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border); text-align: center; }
.stat-box .n { font-size: 24px; font-weight: 700; font-family: "Inter", monospace; color: var(--primary); }
.stat-box .l { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">
  <div style="display:flex;align-items:center;gap:12px;">
    <h4 style="color:var(--text);font-weight:600;margin:0;"><i class="fas fa-database"></i> 数据集管理</h4>
    <select id="pageCat" class="pg-sel" onchange="pageCatChange(this.value)">
      <option value="apple">🍎 苹果</option>
      <option value="bread">🍞 面包</option>
      <option value="beverage">🥤 饮料</option>
    </select>
  </div>
  <span style="color:var(--text-dim);font-size:12px;" id="totalCount">加载中...</span>
</div>
<style>
.pg-sel { background:rgba(10,16,30,0.9); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:12px; }
</style>

<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;">
  <a href="/annotate" class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);"><i class="fas fa-tags"></i> 去标注未分类图片</a>
  <span style="color:var(--text-dim);font-size:12px;">模型训练：</span>
  <button class="btn btn-sm" style="border:1px solid var(--accent);color:var(--accent);background:rgba(0,255,136,0.06);" onclick="startRetrain()"><i class="fas fa-sync-alt"></i> SVM+RF 重训</button>
  <button class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);" onclick="exportTrain('dl')"><i class="fas fa-upload"></i> 导出DL训练集</button>
  <button class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);" onclick="startRetrainDL()"><i class="fas fa-brain"></i> 重训DL</button>
  <button class="btn btn-sm" style="border:1px solid var(--warning);color:var(--warning);background:rgba(255,193,7,0.08);" onclick="exportTrain('yolo')"><i class="fas fa-upload"></i> 导出YOLO训练集</button>
  <button class="btn btn-sm" style="border:1px solid var(--warning);color:var(--warning);background:rgba(255,193,7,0.08);" onclick="startRetrainYOLO()"><i class="fas fa-crop-alt"></i> 重训YOLO</button>
  <span id="retrainState" style="color:var(--text-dim);font-size:12px;"></span>
</div>
<div style="font-size:11px;color:var(--text-dim);margin:0 0 12px;line-height:1.7;">流程：先点“导出DL/YOLO训练集”（把收集的数据合并进对应训练集），数据量足够后再点“重训DL/YOLO”。YOLO 在 CPU 上训练较慢，会提示输入轮数，建议先用 3~5 轮测试。</div>
<div id="retrainLog" style="display:none;background:rgba(10,16,30,0.9);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--accent);max-height:220px;overflow-y:auto;margin-bottom:14px;font-family:Consolas,monospace;white-space:pre-wrap;"></div>
<div class="stat-row" id="statRow"></div>
<div id="categoryContainer"></div>

<script>
var CAT_NAMES = {apple: "苹果", bread: "面包", beverage: "饮料"};

function loadDataset() {
  var cat = localStorage.getItem('category') || 'apple';
  document.getElementById("pageCat").value = cat;
  fetch("/api/dataset/list?category=" + cat)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var cats = d.categories || {};
      var total = d.total || 0;
      document.getElementById("totalCount").textContent = "共 " + total + " 张图片";

      var keys = Object.keys(cats);
      var statHtml = "";
      if (keys.length === 0) {
        statHtml = '<div class="stat-box"><div class="n" style="color:var(--text-dim);">0</div><div class="l">暂无数据</div></div>';
      } else {
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var cnt = 0;
          var labels = cats[k] || {};
          var lk = Object.keys(labels);
          for (var j = 0; j < lk.length; j++) cnt += (labels[lk[j]] || []).length;
          statHtml += '<div class="stat-box"><div class="n">' + cnt + '</div><div class="l">' + (CAT_NAMES[k] || k) + '</div></div>';
        }
      }
      document.getElementById("statRow").innerHTML = statHtml;

      var html = "";
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var labels = cats[k] || {};
        var lk = Object.keys(labels);
        if (lk.length === 0) continue;
        var catTotal = 0;
        for (var j = 0; j < lk.length; j++) catTotal += (labels[lk[j]] || []).length;
        html += '<div class="cat-card"><div class="cat-title">' + (CAT_NAMES[k] || k) + ' <span>' + catTotal + ' 张</span></div>';
        for (var j = 0; j < lk.length; j++) {
          var lb = lk[j];
          var imgs = labels[lb] || [];
          if (imgs.length === 0) continue;
          html += '<div class="label-group"><div class="label-title">' + lb + ' (' + imgs.length + ')</div><div class="img-grid">';
          for (var m = 0; m < imgs.length; m++) {
            html += '<div class="img-item"><img src="/dataset_collected/' + k + '/' + lb + '/' + imgs[m] + '" loading="lazy">'+ '<button class="img-del" onclick="delImg(\'' + k + '\',\'' + lb + '\',\'' + imgs[m] + '\')">✕</button>'+ '<select class="img-move" onchange="moveImg(this, \'' + k + '\', \'' + lb + '\', \'' + imgs[m] + '\')">'+ '<option value="">改标签</option><option value="合格">→合格</option><option value="不合格">→不合格</option></select>' + '</div>';
          }
          html += '</div></div>';
        }
        html += '</div>';
      }
      if (html === "") html = '<div style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px;">还没有收集数据，去检测页面保存图片到数据集吧</div>';
      document.getElementById("categoryContainer").innerHTML = html;
    });
}

function moveImg(sel, cat, fromLabel, fname) {
  var to = sel.value;
  if (!to) return;
  if (!confirm('确认把该图片从「' + fromLabel + '」移动到「' + to + '」？')) { sel.value = ''; return; }
  var fd = new FormData();
  fd.append('category', cat);
  fd.append('filename', fname);
  fd.append('from_label', fromLabel);
  fd.append('to_label', to);
  fetch('/api/dataset/move', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) { loadDataset(); } else { alert(d.error || '移动失败'); sel.value = ''; }
    });
}

function delImg(cat, label, fname) {
  if (!confirm("确认删除该图片？")) return;
  var fd = new FormData();
  fd.append("category", cat);
  fd.append("label", label);
  fd.append("filename", fname);
  fetch("/api/dataset/delete", { method: "POST", body: fd })
    .then(function(r) { return r.json(); })
    .then(function(d) { if (d.success) loadDataset(); else alert(d.error || "删除失败"); });
}

function pageCatChange(val) {
  localStorage.setItem('category', val);
  switchCategory(val);
}

function startRetrain() {
  var cat = localStorage.getItem('category') || 'apple';
  if (!confirm('确认对 ' + cat + ' 品类执行一键重训（SVM+RF）？将自动切分数据集、备份旧模型并登记新版本。')) return;
  runRetrain(cat, ['svm','rf'], 15);
}
function startRetrainDL() {
  var cat = localStorage.getItem('category') || 'apple';
  var ep = prompt('DL 训练轮数（默认 15）', '15');
  if (ep === null) return;
  ep = parseInt(ep, 10) || 15;
  runRetrain(cat, ['dl'], ep);
}
function startRetrainYOLO() {
  var cat = localStorage.getItem('category') || 'apple';
  var ep = prompt('YOLO 训练轮数（默认 30；CPU 训练较慢，建议先试 3~5 轮）', '30');
  if (ep === null) return;
  ep = parseInt(ep, 10) || 30;
  runRetrain(cat, ['yolo'], ep);
}
function runRetrain(cat, models, epochs) {
  fetch('/api/retrain', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({category: cat, models: models, epochs: epochs})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.success) pollRetrain();
      else alert(d.error || '启动失败');
    })
    .catch(function(e){ alert('启动失败: ' + e); });
}
function exportTrain(model) {
  var cat = localStorage.getItem('category') || 'apple';
  var name = model === 'yolo' ? 'YOLO' : 'DL';
  if (!confirm('确认把当前品类的收集数据导出并合并到' + name + '训练集？')) return;
  fetch('/api/export/train', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({category: cat, model: model})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.success) pollRetrain();
      else alert(d.error || '启动失败');
    })
    .catch(function(e){ alert('启动失败: ' + e); });
}
var retrainTimer = null;
function pollRetrain() {
  var logBox = document.getElementById('retrainLog');
  var state = document.getElementById('retrainState');
  logBox.style.display = 'block';
  if (retrainTimer) clearInterval(retrainTimer);
  retrainTimer = setInterval(function() {
    fetch('/api/retrain/status').then(function(r){ return r.json(); }).then(function(d) {
      logBox.textContent = (d.log || []).join('\n');
      if (d.running) { state.textContent = '⏳ 训练中...'; }
      else {
        clearInterval(retrainTimer);
        if (d.error) { state.textContent = '❌ 失败: ' + d.error; logBox.style.color = 'var(--danger)'; }
        else { state.textContent = '✅ 完成，新模型已生效（无需重启）'; logBox.style.color = 'var(--accent)'; }
      }
    });
  }, 1500);
}

loadDataset();
</script>
{% endblock %}
