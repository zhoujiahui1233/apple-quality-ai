{% extends "base.html" %}
{% block title %}批量标注{% endblock %}
{% block content %}
<style>
.annot-wrap { max-width: 900px; margin: 0 auto; }
.annot-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.annot-progress { flex:1; color:var(--text-dim); font-size:13px; }
.annot-progress b { color:var(--primary); font-size:18px; }
.annot-img-box { background:#000; border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:420px; max-height:560px; }
.annot-img-box img { max-width:100%; max-height:560px; object-fit:contain; }
.annot-btns { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
.annot-btn { flex:1; min-width:150px; padding:16px 10px; border-radius:12px; border:1px solid var(--border); background:rgba(10,16,30,0.8); color:var(--text); font-size:16px; font-weight:600; cursor:pointer; transition:0.2s; }
.annot-btn:hover { transform:translateY(-2px); }
.annot-btn .k { display:block; font-size:11px; color:var(--text-dim); font-weight:400; margin-top:4px; }
.btn-good { border-color:var(--accent); color:var(--accent); }
.btn-good:hover { background:rgba(0,255,136,0.12); }
.btn-bad { border-color:var(--danger); color:var(--danger); }
.btn-bad:hover { background:rgba(255,71,87,0.12); }
.btn-skip { border-color:var(--warning); color:var(--warning); }
.btn-skip:hover { background:rgba(255,193,7,0.10); }
.annot-empty { text-align:center; padding:80px 20px; color:var(--text-dim); }
.annot-empty .big { font-size:48px; margin-bottom:12px; }
</style>

<div class="annot-wrap">
  <div class="annot-head">
    <h4 style="color:var(--text);margin:0;"><i class="fas fa-tags"></i> 批量标注</h4>
    <div class="annot-progress">剩余 <b id="remain">--</b> 张未标注图片</div>
    <select id="annotCat" style="background:rgba(10,16,30,0.9);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;">
      <option value="apple">🍎 苹果</option>
      <option value="bread">🍞 面包</option>
      <option value="beverage">🥤 饮料</option>
    </select>
    <a href="/dataset" class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);">查看数据集</a>
  </div>

  <div id="annotArea">
    <div class="annot-empty">
      <div class="big">📭</div>
      <div>没有待标注图片。到监测页检测后点击"保存到数据集"选"未分类"，图片会进入这里。</div>
    </div>
  </div>
</div>

<script>
var curItem = null;
var categoryNames = {apple: "苹果", bread: "面包", beverage: "饮料"};

function loadQueue(first) {
  fetch("/api/annotate/queue")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById("remain").textContent = d.count;
      var items = d.items || [];
      if (items.length === 0) {
        document.getElementById("annotArea").innerHTML =
          '<div class="annot-empty"><div class="big">🎉</div><div>全部标注完成！可以到数据集页查看，或运行"一键重训"。</div></div>';
        return;
      }
      if (first) { curItem = items[0]; }
      renderItem();
    });
}

function renderItem() {
  if (!curItem) { loadQueue(true); return; }
  var cat = document.getElementById("annotCat").value;
  document.getElementById("annotArea").innerHTML =
    '<div class="annot-img-box"><img src="/dataset_collected/' + curItem.path + '?t=' + Date.now() + '" alt="待标注图片"></div>' +
    '<div class="annot-btns">' +
      '<button class="annot-btn btn-good" onclick="doLabel(\'合格\')">✅ 合格<span class="k">快捷键 1</span></button>' +
      '<button class="annot-btn btn-bad" onclick="doLabel(\'不合格\')">❌ 不合格<span class="k">快捷键 2</span></button>' +
      '<button class="annot-btn btn-skip" onclick="doSkip()">⏭ 跳过<span class="k">快捷键 3</span></button>' +
    '</div>';
}

function doLabel(label) {
  if (!curItem) return;
  var cat = document.getElementById("annotCat").value;
  fetch("/api/annotate/save", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({src: curItem.path, category: cat, label: label})})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        document.getElementById("remain").textContent = d.remaining;
        curItem = null;
        loadQueue(false);
      } else alert(d.error || "保存失败");
    })
    .catch(function(e) { alert("保存失败: " + e); });
}

function doSkip() {
  if (!curItem) return;
  fetch("/api/annotate/skip", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({src: curItem.path})})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        document.getElementById("remain").textContent = d.remaining;
        curItem = null;
        loadQueue(false);
      } else alert(d.error || "跳过失败");
    })
    .catch(function(e) { alert("跳过失败: " + e); });
}

document.addEventListener("keydown", function(e) {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "1") doLabel("合格");
  else if (e.key === "2") doLabel("不合格");
  else if (e.key === "3") doSkip();
});

(function() {
  var saved = localStorage.getItem("category") || "apple";
  if (["apple","bread","beverage"].indexOf(saved) === -1) saved = "apple";
  document.getElementById("annotCat").value = saved;
})();
document.getElementById("annotCat").addEventListener("change", function() {
  localStorage.setItem("category", this.value);
  switchCategory(this.value);
});
loadQueue(true);
</script>
{% endblock %}
