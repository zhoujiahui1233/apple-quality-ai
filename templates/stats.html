{% extends "base.html" %}
{% block title %}数据统计{% endblock %}
{% block content %}
<div style="text-align:right;margin-bottom:12px;">
  <a href="/api/export/report" class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);"><i class="fas fa-download"></i> 导出报告</a>
</div>
<style>
.stat-card { padding: 20px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); }
.stat-card .num { font-size: 32px; font-weight: 700; font-family: 'Inter', monospace; }
.stat-card .lbl { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.chart-wrap { position: relative; height: 250px; width: 100%; }
</style>

<div class="row g-3 mb-3">
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--primary);" id="statTotal">--</div><div class="lbl">累计检测</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--accent);" id="statPremium">--</div><div class="lbl">优质率</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--danger);" id="statReject">--</div><div class="lbl">不合格率</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--warning);" id="statToday">--</div><div class="lbl">今日检测</div></div></div>
</div>

<div class="row g-3">
  <div class="col-lg-8">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-line"></i> 检测趋势</div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 等级分布</div>
      <div class="chart-wrap" style="height:220px;"><canvas id="distChart"></canvas></div>
    </div>
  </div>
</div>

<div class="row g-3 mt-1">
  <div class="col-lg-6">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-bar"></i> 模型准确率对比</div>
      <div class="chart-wrap" style="height:200px;"><canvas id="modelChart"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-clock"></i> 最近检测</div>
      <div class="log-container" id="recentLog" style="height:200px;">
        <div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px;">加载中...</div>
      </div>
    </div>
  </div>
</div>

<script>
fetch('/api/stats').then(function(r) { return r.json(); }).then(function(d) {
  var total = d.total || 0;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPremium').textContent = total > 0 ? (d.premium / total * 100).toFixed(1) + '%' : '0%';
  document.getElementById('statReject').textContent = total > 0 ? (d.reject / total * 100).toFixed(1) + '%' : '0%';
  // Distribution chart
  new Chart(document.getElementById('distChart'), {
    type: 'doughnut', data: {
      labels: ['优质', '标准', '不合格'],
      datasets: [{ data: [d.premium, d.standard, d.reject],
        backgroundColor: ['rgba(0,255,136,0.7)', 'rgba(255,193,7,0.7)', 'rgba(255,71,87,0.7)'],
        borderColor: ['#00ff88', '#ffc107', '#ff4757'], borderWidth: 1 }]
    },
    options: { responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: '#8899bb', font: {size:11}, padding: 8 } } } }
  });
});

fetch('/api/stats/daily?days=7').then(function(r) { return r.json(); }).then(function(data) {
  var days = ['前6天','前5天','前4天','前3天','前2天','昨天','今天'];
  var labels = data.map(function(_, i) { return days[i] || '第' + (i+1) + '天'; });
  new Chart(document.getElementById('trendChart'), {
    type: 'line', data: {
      labels: labels,
      datasets: [
        { label: '优质', data: data.map(function(d) { return d.premium; }), borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.1)', fill: true, tension: 0.3 },
        { label: '不合格', data: data.map(function(d) { return d.reject; }), borderColor: '#ff4757', backgroundColor: 'rgba(255,71,87,0.1)', fill: true, tension: 0.3 },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8899bb', font: {size:11} } } },
      scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,212,255,0.06)' }, ticks: { color: '#8899bb', stepSize: 1 } },
                x: { grid: { display: false }, ticks: { color: '#8899bb' } } } }
  });
  
  var today = data[data.length - 1] || {};
  document.getElementById('statToday').textContent = (today.total || 0) + '次';
});

// Model chart (simulated)
new Chart(document.getElementById('modelChart'), {
  type: 'bar', data: {
    labels: ['SVM', 'RF', 'DL', 'YOLO'],
    datasets: [{
      label: '准确率 %', data: [94.5, 93.2, 96.8, 98.1],
      backgroundColor: ['rgba(139,69,19,0.7)', 'rgba(0,100,0,0.7)', 'rgba(0,0,139,0.7)', 'rgba(139,0,139,0.7)'],
      borderColor: ['#8B4513', '#006400', '#00008B', '#8B008B'], borderWidth: 1, borderRadius: 4
    }]
  },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(c) { return c.raw + '%'; } } } },
    scales: { y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,212,255,0.06)' }, ticks: { color: '#8899bb' } },
              x: { grid: { display: false }, ticks: { color: '#8899bb' } } } }
});

// Recent detections
fetch('/history?page=1').then(function(r) { return r.text(); }).then(function() {
  fetch('/api/stats').then(function(r) { return r.json(); }).then(function(d) {
    var log = document.getElementById('recentLog');
    log.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-dim);font-size:12px;">共 ' + (d.total || 0) + ' 次检测 | 优质率: ' + (d.total ? (d.premium/d.total*100).toFixed(1) : 0) + '%</div>';
  });
});
</script>
{% endblock %}
