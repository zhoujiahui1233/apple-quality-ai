{% extends "base.html" %}
{% block title %}数据统计{% endblock %}
{% block content %}
<div style="text-align:right;margin-bottom:12px;">
  <select id="statCat" class="pg-sel" onchange="statCatChange(this.value)" style="margin-right:8px;">
    <option value="">全部品类</option>
    <option value="apple">🍎 苹果</option>
    <option value="bread">🍞 面包</option>
    <option value="beverage">🥤 饮料</option>
  </select>
  <a href="/api/export/report" class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);"><i class="fas fa-download"></i> 导出报告</a>
</div>
<style>
.pg-sel { background:rgba(10,16,30,0.9); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:12px; }
</style>
<style>
.stat-card { padding: 20px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); }
.stat-card .num { font-size: 32px; font-weight: 700; font-family: 'Inter', monospace; }
.stat-card .lbl { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.chart-wrap { position: relative; height: 250px; width: 100%; }
</style>

<div class="row g-3 mb-3">
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--primary);" id="statTotal">--</div><div class="lbl">累计检测</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--accent);" id="statPremium">--</div><div class="lbl">优质率</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--danger);" id="statReject">--</div><div class="lbl">不合格率</div></div></div>
  <div class="col-3"><div class="stat-card text-center"><div class="num" style="color:var(--warning);" id="statToday">--</div><div class="lbl">今日检测</div></div></div>
</div>

<div class="row g-3">
  <div class="col-lg-8">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-line"></i> 检测趋势</div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-pie"></i> 等级分布</div>
      <div class="chart-wrap" style="height:220px;"><canvas id="distChart"></canvas></div>
    </div>
  </div>
</div>

<div class="row g-3 mt-1">
  <div class="col-lg-6">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-chart-bar"></i> 模型准确率对比</div>
      <div class="chart-wrap" style="height:200px;"><canvas id="modelChart"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="glass-card p-3">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-clock"></i> 最近检测</div>
      <div class="log-container" id="recentLog" style="height:200px;">
        <div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px;">加载中...</div>
      </div>
    </div>
  </div>
</div>


<div class="glass-card p-3 mt-3">
  <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px;"><i class="fas fa-tasks"></i> 数据批量管理（按条件选中记录，可批量删除或改等级/品类）</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;">
    <select id="mgCat" class="mg-sel"><option value="">全部品类</option><option value="apple">🍎 苹果</option><option value="bread">🍞 面包</option><option value="beverage">🥤 饮料</option></select>
    <select id="mgGrade" class="mg-sel"><option value="">全部等级</option><option value="premium">优等</option><option value="standard">合格</option><option value="reject">不合格</option></select>
    <span style="color:var(--text-dim);">日期:</span>
    <input type="date" id="mgFrom" class="mg-sel">
    <span style="color:var(--text-dim);">至</span>
    <input type="date" id="mgTo" class="mg-sel">
    <button class="btn btn-sm" style="border:1px solid var(--primary);color:var(--primary);background:rgba(0,212,255,0.08);" onclick="mgCount()"><i class="fas fa-search"></i> 查询数量</button>
    <span style="color:var(--text-dim);">匹配 <span id="mgCountNum" style="color:var(--accent);font-weight:700;">--</span> 条</span>
    <span style="flex:1;"></span>
    <select id="mgNewGrade" class="mg-sel"><option value="">改等级为…</option><option value="premium">优等</option><option value="standard">合格</option><option value="reject">不合格</option></select>
    <button class="btn btn-sm" style="border:1px solid var(--accent);color:var(--accent);background:rgba(0,255,136,0.06);" onclick="mgUpdate('grade')">批量改等级</button>
    <select id="mgNewCat" class="mg-sel"><option value="">改品类为…</option><option value="apple">苹果</option><option value="bread">面包</option><option value="beverage">饮料</option></select>
    <button class="btn btn-sm" style="border:1px solid var(--warning);color:var(--warning);background:rgba(255,193,7,0.06);" onclick="mgUpdate('category')">批量改品类</button>
    <button class="btn btn-sm btn-danger" onclick="mgDelete()"><i class="fas fa-trash"></i> 批量删除</button>
  </div>
</div>
<style>
.mg-sel { background:rgba(10,16,30,0.9); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:12px; }
.mg-sel::-webkit-calendar-picker-indicator { filter: invert(1); opacity:0.6; }
</style>
<script>
(function() { var mc = document.getElementById('mgCat'); if (mc && CUR_CAT) mc.value = CUR_CAT; })();
function mgFilter() {
  var f = {};
  var cat = document.getElementById('mgCat').value;
  var grade = document.getElementById('mgGrade').value;
  var frm = document.getElementById('mgFrom').value;
  var to = document.getElementById('mgTo').value;
  if (cat) f.category = cat;
  if (grade) f.grade = grade;
  if (frm) f.date_from = frm;
  if (to) f.date_to = to;
  return f;
}
function mgCount() {
  fetch('/api/records/count', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({filter: mgFilter()})})
    .then(function(r){ return r.json(); }).then(function(d){ document.getElementById('mgCountNum').textContent = d.count; })
    .catch(function(){ alert('查询失败'); });
}
function mgDelete() {
  var n = document.getElementById('mgCountNum').textContent;
  if (n === '--' || parseInt(n) <= 0) { alert('请先点击“查询数量”确认要删除的记录数'); return; }
  if (!confirm('确认删除匹配的 ' + n + ' 条记录？此操作不可恢复。')) return;
  fetch('/api/records/batch_delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({filter: mgFilter()})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.success) { alert('已删除 ' + d.deleted + ' 条'); window.location.reload(); }
      else alert(d.error || '删除失败');
    }).catch(function(e){ alert('删除失败: ' + e); });
}
function mgUpdate(field) {
  var sel = field === 'grade' ? 'mgNewGrade' : 'mgNewCat';
  var val = document.getElementById(sel).value;
  if (!val) { alert('请选择要修改为的值'); return; }
  var n = document.getElementById('mgCountNum').textContent;
  if (n === '--' || parseInt(n) <= 0) { alert('请先点击“查询数量”确认匹配记录'); return; }
  var updates = {}; updates[field] = val;
  if (!confirm('确认批量修改匹配的 ' + n + ' 条记录？')) return;
  fetch('/api/records/batch_update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({filter: mgFilter(), updates: updates})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.success) { alert('已修改 ' + d.updated + ' 条'); window.location.reload(); }
      else alert(d.error || '修改失败');
    }).catch(function(e){ alert('修改失败: ' + e); });
}
</script>

<script>
var CUR_CAT = localStorage.getItem('category');
if (CUR_CAT === null) CUR_CAT = 'apple';
document.getElementById('statCat').value = CUR_CAT;
function statCatChange(val) {
  if (!val) { localStorage.setItem('category', ''); window.location.reload(); return; }
  localStorage.setItem('category', val);
  switchCategory(val);
}
fetch('/api/stats' + (CUR_CAT ? '?category=' + CUR_CAT : '')).then(function(r) { return r.json(); }).then(function(d) {
  var total = d.total || 0;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPremium').textContent = total > 0 ? (d.premium / total * 100).toFixed(1) + '%' : '0%';
  document.getElementById('statReject').textContent = total > 0 ? (d.reject / total * 100).toFixed(1) + '%' : '0%';
  // Distribution chart
  new Chart(document.getElementById('distChart'), {
    type: 'doughnut', data: {
      labels: ['优质', '标准', '不合格'],
      datasets: [{ data: [d.premium, d.standard, d.reject],
        backgroundColor: ['rgba(0,255,136,0.7)', 'rgba(255,193,7,0.7)', 'rgba(255,71,87,0.7)'],
        borderColor: ['#00ff88', '#ffc107', '#ff4757'], borderWidth: 1 }]
    },
    options: { responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: { legend: { position: 'bottom', labels: { color: '#8899bb', font: {size:11}, padding: 8 } } } }
  });
});

fetch('/api/stats/daily?days=7' + (CUR_CAT ? '&category=' + CUR_CAT : '')).then(function(r) { return r.json(); }).then(function(data) {
  var days = ['前6天','前5天','前4天','前3天','前2天','昨天','今天'];
  var labels = data.map(function(_, i) { return days[i] || '第' + (i+1) + '天'; });
  new Chart(document.getElementById('trendChart'), {
    type: 'line', data: {
      labels: labels,
      datasets: [
        { label: '优质', data: data.map(function(d) { return d.premium; }), borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.1)', fill: true, tension: 0.3 },
        { label: '不合格', data: data.map(function(d) { return d.reject; }), borderColor: '#ff4757', backgroundColor: 'rgba(255,71,87,0.1)', fill: true, tension: 0.3 },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8899bb', font: {size:11} } } },
      scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,212,255,0.06)' }, ticks: { color: '#8899bb', stepSize: 1 } },
                x: { grid: { display: false }, ticks: { color: '#8899bb' } } } }
  });
  
  var today = data[data.length - 1] || {};
  document.getElementById('statToday').textContent = (today.total || 0) + '次';
});

// Model chart (simulated)
new Chart(document.getElementById('modelChart'), {
  type: 'bar', data: {
    labels: ['SVM', 'RF', 'DL', 'YOLO'],
    datasets: [{
      label: '准确率 %', data: [94.5, 93.2, 96.8, 98.1],
      backgroundColor: ['rgba(139,69,19,0.7)', 'rgba(0,100,0,0.7)', 'rgba(0,0,139,0.7)', 'rgba(139,0,139,0.7)'],
      borderColor: ['#8B4513', '#006400', '#00008B', '#8B008B'], borderWidth: 1, borderRadius: 4
    }]
  },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(c) { return c.raw + '%'; } } } },
    scales: { y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,212,255,0.06)' }, ticks: { color: '#8899bb' } },
              x: { grid: { display: false }, ticks: { color: '#8899bb' } } } }
});

// Recent detections
fetch('/history?page=1').then(function(r) { return r.text(); }).then(function() {
  var CUR_CAT = localStorage.getItem('category');
if (CUR_CAT === null) CUR_CAT = 'apple';
document.getElementById('statCat').value = CUR_CAT;
function statCatChange(val) {
  if (!val) { localStorage.setItem('category', ''); window.location.reload(); return; }
  localStorage.setItem('category', val);
  switchCategory(val);
}
fetch('/api/stats' + (CUR_CAT ? '?category=' + CUR_CAT : '')).then(function(r) { return r.json(); }).then(function(d) {
    var log = document.getElementById('recentLog');
    log.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-dim);font-size:12px;">共 ' + (d.total || 0) + ' 次检测 | 优质率: ' + (d.total ? (d.premium/d.total*100).toFixed(1) : 0) + '%</div>';
  });
});
</script>
{% endblock %}
